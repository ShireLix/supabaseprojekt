<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supabase Notes – mini projekt</title>

  <!-- Tailwind CSS CDN -->
  <script src="[cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  
  <!-- Supabase JavaScript könyvtár -->
  <script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2)"></script>
</head>

<body class="bg-gray-100 min-h-screen py-8 px-4">
  <div class="max-w-2xl mx-auto">
    
    <!-- Főcím -->
    <h1 class="text-3xl font-bold text-gray-800 mb-8 flex items-center gap-2">
      📝 Supabase Notes – mini projekt
    </h1>

    <!-- Új jegyzet kártya -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-8">
      <h2 class="text-xl font-semibold text-gray-700 mb-4">Új jegyzet</h2>

      <form id="noteForm" class="space-y-4">
        <!-- Cím input -->
        <div>
          <label for="title" class="block text-sm font-medium text-gray-600 mb-1">Cím</label>
          <input 
            id="title" 
            type="text"
            placeholder="Add meg a jegyzet címét" 
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
          />
        </div>

        <!-- Tartalom textarea -->
        <div>
          <label for="content" class="block text-sm font-medium text-gray-600 mb-1">Tartalom</label>
          <textarea 
            id="content" 
            placeholder="Írd ide a jegyzet szövegét..." 
            rows="4" 
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition resize-none"
          ></textarea>
        </div>

        <!-- Mentés gomb -->
        <button 
          type="submit"
          class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 flex items-center justify-center gap-2"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
          Mentés
        </button>
      </form>
    </div>

    <!-- Elválasztó -->
    <hr class="border-gray-300 mb-8" />

    <!-- Jegyzetek lista -->
    <div>
      <h2 class="text-xl font-semibold text-gray-700 mb-4">Jegyzetek</h2>
      <div id="list" class="space-y-4">
        <!-- Itt jelennek meg a jegyzetek -->
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "[deyljxciuhkpyipfyadt.supabase.co](https://deyljxciuhkpyipfyadt.supabase.co)";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRleWxqeGNpdWhrcHlpcGZ5YWR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1MjY4ODgsImV4cCI6MjA4ODEwMjg4OH0.H-1WFGJz6JwawOPUMZZIlZGllSyk_f3oxlWHWBlXPS4";
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById("noteForm");
    const listEl = document.getElementById("list");

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text ?? "";
      return div.innerHTML;
    }

    // Dátum formázása olvashatóbb formátumra
    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('hu-HU', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    async function loadNotes() {
      const { data, error } = await supabaseClient
        .from("Notes")
        .select("id, title, content, created_at")
        .order("created_at", { ascending: false });

      console.log("SELECT:", data, error);

      if (error) {
        listEl.innerHTML = `
          <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">
            <p class="font-medium">Hiba történt</p>
            <p class="text-sm">${escapeHtml(error.message)}</p>
          </div>
        `;
        return;
      }

      if (!data || data.length === 0) {
        listEl.innerHTML = `
          <div class="bg-gray-50 border border-gray-200 text-gray-600 px-4 py-8 rounded-lg text-center">
            <svg class="w-12 h-12 mx-auto mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            <p>Még nincs egyetlen jegyzet sem.</p>
            <p class="text-sm">Hozz létre egyet a fenti űrlap segítségével!</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = data.map(note => `
        <div class="bg-white rounded-lg shadow-md p-5 hover:shadow-lg transition duration-200 border-l-4 border-blue-500">
          <h3 class="text-lg font-semibold text-gray-800 mb-2">${escapeHtml(note.title)}</h3>
          <p class="text-gray-600 mb-3 whitespace-pre-wrap">${escapeHtml(note.content)}</p>
          <div class="flex items-center text-sm text-gray-400">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            ${escapeHtml(formatDate(note.created_at))}
          </div>
        </div>
      `).join("");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const title = document.getElementById("title").value.trim();
      const content = document.getElementById("content").value.trim();

      if (!title || !content) {
        alert("Mindkét mező kitöltése kötelező.");
        return;
      }

      // Gomb letiltása mentés közben
      const submitBtn = form.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Mentés...
      `;

      const { data, error } = await supabaseClient
        .from("Notes")
        .insert([{ title, content }])
        .select();

      console.log("INSERT:", data, error);

      // Gomb visszaállítása
      submitBtn.disabled = false;
      submitBtn.innerHTML = originalText;

      if (error) {
        alert("Hiba történt: " + error.message);
        return;
      }

      // Sikeres mentés visszajelzés
      form.reset();
      loadNotes();
    });

    loadNotes();
  </script>
</body>
</html>
